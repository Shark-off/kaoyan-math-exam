<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}]});"></script>
<style>
  :root { --ink:#1a1a1a; --muted:#666; --line:#d9d9d9; --accent:#1a4b8c; --bg:#f6f7f9; }
  * { box-sizing:border-box; }
  body { font-family:"Source Han Serif SC","Noto Serif SC","SimSun",serif; color:var(--ink);
         max-width:820px; margin:0 auto; padding:32px 24px; background:#fff; line-height:1.7; font-size:16px; }
  header.paper { text-align:center; border-bottom:3px double var(--ink); padding-bottom:16px; margin-bottom:24px; }
  header.paper h1 { font-size:22px; margin:0 0 10px; letter-spacing:2px; }
  .meta { color:var(--muted); font-size:14px; }
  .q { border:1px solid var(--line); border-radius:6px; padding:14px 18px; margin:0 0 16px; page-break-inside:avoid; }
  .q-head { display:flex; gap:8px; align-items:baseline; }
  .q-num { font-weight:700; }
  .q-body { flex:1; }
  .tag { display:inline-block; font-size:12px; background:var(--bg); color:var(--muted);
         border:1px solid var(--line); border-radius:3px; padding:1px 8px; margin-left:6px; vertical-align:2px; }
  .tag.level { color:var(--accent); border-color:var(--accent); }
  h2.solutions-title { border-top:3px double var(--ink); margin-top:36px; padding-top:16px; font-size:20px; letter-spacing:2px; }
  .sol { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:6px;
         padding:12px 16px; margin:0 0 14px; page-break-inside:avoid; background:#fcfcfd; }
  .sol .tag { background:#fff; }
  .sol .tag.answer { background:#1a7a3c; color:#fff; border-color:#1a7a3c; }
  .sol-body { margin-top:8px; }
  .toolbar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line);
             padding:10px 0; margin-bottom:18px; display:flex; gap:10px; }
  .toolbar button { font-family:inherit; font-size:14px; padding:6px 16px; border:1px solid var(--accent);
             background:#fff; color:var(--accent); border-radius:4px; cursor:pointer; }
  .toolbar button:hover { background:var(--accent); color:#fff; }
  body.no-solutions .solutions { display:none; }
  @media print {
    .toolbar { display:none; }
    body { padding:0; max-width:100%; }
    .q, .sol { page-break-inside:avoid; }
    h2.solutions-title { page-break-before:always; }
    @page { margin:18mm 15mm; }
  }
</style>
</head>
<body class="no-solutions">

<div class="toolbar">
  <button onclick="document.body.classList.toggle('no-solutions')">显示 / 隐藏解析</button>
  <button onclick="window.print()">打印</button>
</div>

<header class="paper">
  <h1>{{TITLE}}</h1>
  <div class="meta">{{META}}</div>
</header>

<!-- 每题结构模板：
<div class="q">
  <div class="q-head"><span class="q-num">1.</span>
    <div class="q-body">题干（LaTeX 公式用 \( \) 或 \[ \]）
      <span class="tag">考点：2.3 中值定理</span><span class="tag level">难度：中等</span>
    </div>
  </div>
</div>
（选择题在题干后加 <div class="choices">…</div>）
-->
{{QUESTIONS}}

<section class="solutions">
  <h2 class="solutions-title">参考答案与解析</h2>

  <!-- 每题解析结构模板：
  <div class="sol">
    <span class="tag">第 1 题</span><span class="tag answer">答案</span>
    <div class="sol-body">
      <p>考点、方法、完整解析过程……</p>
    </div>
  </div>
  -->
  {{SOLUTIONS}}
</section>

</body>
</html>
